# Experiment configuration (all independent-variable settings, paths, thresholds)
experiment:
  name: itsm-ai-triage-research
  is_sample: true          # true -> banner "SAMPLE DATA, pipeline check only"
  random_seed: 42
  timeout_sec: 60          # warn if the pipeline runs longer than this

paths:
  cases_csv: data/sample/cases.csv
  coder_agreement_csv: data/sample/coder_agreement.csv
  output_dir: results
  processed_dir: data/processed
  figures_dir: reports/figures

# Independent variables (IV1, IV2): admissible coded values
independent_variables:
  triage_type: {0: "Legacy rule-based / manual", 1: "ML / AI predictive classifier"}
  autonomy_level: {1: "Advisory", 2: "Semi-autonomous (human override)", 3: "Full autonomous"}

# Groups (baselines + experimental group)
groups:
  C1: "Legacy baseline"
  C2: "Vanilla AI baseline"
  E1: "Guardrailed hybrid AI"

statistics:
  alpha: 0.05
  min_group_size: 3        # sample run; raise to >= 10 for the real data collection (Week 7)

# Guardrail metrics (pre-registered thresholds)
guardrails:
  max_ai_bounce_rate_pct: 15.0       # mean R_bounce of AI groups must not exceed this
  min_weighted_kappa: 0.70           # inter-coder agreement for DV1 (DAP coding)
  min_third_party_share: 0.30        # share of cases from post-mortems / regulatory filings
  third_party_sources: [postmortem, regulatory_filing]
  forbid_full_autonomy_without_governance: true   # no case with autonomy=3 and Igov=0


benchmark:
  warmup_runs: 15
  test_runs: 100
  disable_gc: true                       # gc.collect() before, gc off during each timed call
  max_unexpected_error_rate_pct: 0.0     # expected invalid-input edge cases are reported separately
  bootstrap_samples: 2000
  output_jsonl: data/raw/test_run.jsonl  # line 1 = metadata, then one line per run
  workload:
    n_inputs: 50                # distinct synthetic inputs, cycled over the runs
    pareto_alpha: 1.5           # tail index of input size (smaller = heavier tail)
    base_rows: 12               # scale of input size (rows of cases)
    max_rows: 2000              # cap on rows per input
    edge_case_fraction: 0.10    # share of inputs that are edge cases (incl. invalid ones)
    long_string_len: 100000     # length of the "gigantic string" edge case
